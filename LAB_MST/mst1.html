<!DOCTYPE html>
<html lang="en">

<head>
    <title>Submit Post</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #f0f2f5;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 300px;
            
        }

        input,
        textarea {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background: #28a745;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        #msg {
            color: #28a745;
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="box">
        <h3>Submit Post</h3>
        <input type="text" id="title" placeholder="Title">
        <textarea id="body" placeholder="Body Content"></textarea> 
        <button onclick="sendData()">Submit</button>
        <div id="msg"></div>
    </div>

    <script>
        function sendData() {
            var t = document.getElementById('title').value;
            var b = document.getElementById('body').value;

            fetch('https://jsonplaceholder.typicode.com/posts', {
                method: 'POST',
                body: JSON.stringify({ title: t, body: b }),
                headers: { 'Content-type': 'application/json' }
            })
                .then(function () {
                    document.getElementById('msg').innerText = "Successfully Posted!";
                    document.getElementById('title').value = "";
                    document.getElementById('body').value = "";
                });
        }
    </script>

</body>

</html>
